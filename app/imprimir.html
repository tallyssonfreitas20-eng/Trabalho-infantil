<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imprimir molde · Dedoches Bíblicos</title>
  <link rel="icon" href="img/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 12mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Nunito, system-ui, sans-serif; color: #2B2622; background: #E9DFCC; }
    .bar { position: sticky; top: 0; background: #1A355F; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .bar b { font-family: Fraunces, serif; font-size: 1.1rem; }
    .bar .opts { display: flex; gap: 6px; flex-wrap: wrap; }
    .bar button, .bar a { font: 800 .9rem Nunito, sans-serif; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; }
    .sz { background: rgba(255,255,255,.15); color: #fff; }
    .sz[aria-pressed="true"] { background: #F1D58E; color: #1A355F; }
    .go { background: #A3302B; color: #fff; }
    .back { background: transparent; color: #E9D8B0; }
    .tip { max-width: 190mm; margin: 12px auto 0; background: #FFF6DF; border: 1.5px dashed #C9A45C; border-radius: 12px; padding: 10px 14px; font-size: .9rem; }
    .sheet { width: 186mm; min-height: 260mm; margin: 12px auto 30px; background: #fff; padding: 10mm; box-shadow: 0 10px 30px -15px rgba(0,0,0,.4); }
    .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #1A355F; padding-bottom: 3mm; margin-bottom: 6mm; }
    .head h1 { font-family: Fraunces, serif; font-size: 20pt; margin: 0; color: #1A355F; }
    .head span { font-size: 10pt; color: #6E655C; }
    .molds { display: flex; flex-wrap: wrap; gap: 8mm; align-items: flex-start; }
    .molds img { display: block; height: auto; border: 1px dashed #bbb; }
    .ruler { margin-top: 8mm; display: flex; align-items: center; gap: 3mm; font-size: 9pt; color: #6E655C; }
    .ruler i { display: block; width: 50mm; height: 4mm; border: 1.5px solid #2B2622; border-top: 0; background: repeating-linear-gradient(90deg, #2B2622 0 .4mm, transparent .4mm 10mm); }
    .foot { margin-top: 8mm; font-size: 8.5pt; color: #8a8077; }
    .err { max-width: 420px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 16px; text-align: center; }
    @media print {
      body { background: #fff; }
      .bar, .tip { display: none; }
      .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <b id="nm">Molde</b>
    <div class="opts">
      <button class="sz" data-s="1" aria-pressed="true">Padrão</button>
      <button class="sz" data-s="1.3" aria-pressed="false">Ampliado</button>
      <button class="sz" data-c="2" aria-pressed="false">2 cópias</button>
      <button class="go" id="pr">🖨️ Imprimir</button>
      <a class="back" href="./">← Voltar ao app</a>
    </div>
  </div>
  <p class="tip">Na janela de impressão, escolha <b>tamanho real / 100%</b> (sem "ajustar à página"). Depois confira a régua: ela deve medir 5 cm. Use <b>Ampliado</b> para dedos de adulto.</p>
  <main id="out"></main>
  <script src="catalogo.js"></script>
  <script>
    (function () {
      var W = 58.7; /* largura de 1 molde na folha A4 deitada (mm) */
      var m = (location.hash || '').match(/f(\d{2})_(\d{2})/);
      var out = document.getElementById('out');
      if (!m) { out.innerHTML = '<div class="err">Molde não encontrado. Volte ao app e toque em "Imprimir este molde".</div>'; return; }
      var f = +m[1], p = +m[2], folha = (window.CATALOGO || []).find(function (x) { return x.folha === f; });
      var item = folha && folha.itens[p - 1];
      if (!item) { out.innerHTML = '<div class="err">Molde não encontrado.</div>'; return; }
      var src = 'moldes/cells/f' + m[1] + '_' + m[2] + '.jpg', scale = 1, copies = 1;
      document.title = 'Molde ' + item[0] + ' · Dedoches Bíblicos';
      document.getElementById('nm').textContent = item[0];
      function draw() {
        var w = (W * scale).toFixed(1), imgs = '';
        for (var i = 0; i < copies; i++) imgs += '<img src="' + src + '" style="width:' + w + 'mm" alt="Molde de ' + item[0] + '">';
        out.innerHTML = '<div class="sheet"><div class="head"><h1>' + item[0] + '</h1><span>Folha ' + f + ' · Molde ' + String((f - 1) * 10 + p).padStart(3, '0') + ' · ' + item[1] + (scale > 1 ? ' · ampliado' : '') + '</span></div>' +
          '<div class="molds">' + imgs + '</div>' +
          '<div class="ruler"><i></i> régua de 5 cm</div>' +
          '<p class="foot">Corpo (frente e costas): corte 2x. Demais peças: conforme indicado no molde. 100 Dedoches Bíblicos em Feltro · uso pessoal e para confecção das peças.</p></div>';
      }
      document.querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { scale = +b.dataset.s; document.querySelectorAll('[data-s]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); draw(); }; });
      var cb = document.querySelector('[data-c]'); cb.onclick = function () { copies = copies === 1 ? 2 : 1; cb.setAttribute('aria-pressed', copies === 2); draw(); };
      document.getElementById('pr').onclick = function () { try { window.print(); } catch (e) {} };
      draw();
    })();
  </script>
</body>
</html>
